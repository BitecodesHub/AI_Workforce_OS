# @find: nginx, web server, reverse proxy, api proxy, content security policy, CSP, security headers, host check, DNS rebinding, /api routes, /internal blocked, static files, prerendered pages, app shell, real 404, X-Robots-Tag, noindex, SEO, robots.txt, sitemap.xml, llms.txt, gzip, caching
# @what: Nginx configuration that serves the web client (the prerendered public pages, the app shell for signed-in routes and a real 404), adds security, cache and robots headers and proxies each API prefix to the service that owns it.
# @flow: Mirrors web/vite.config.ts proxy table and web/src/App.tsx routes; copied into the image by infra/launcher/web.Dockerfile; serves the files web/scripts/prerender.mjs writes
# Mirrors the proxy table in web/vite.config.ts. Keep the two in step.

# The Content-Security-Policy, defined once and sent by the server block on every response.
#
# Only this origin is allowed. Scripts, styles and fonts are files from the build (the typeface is
# self-hosted), and React applies style props through the DOM rather than as inline style
# attributes, so neither needs 'unsafe-inline' (the prerendered pages carry no style attribute:
# web/src/seo/document.ts removes them and fails the build if one is left). Images may also be
# data: URLs from the stylesheets, and spoken replies play from blob: URLs the voice player
# creates. One inline script is allowed by its hash: the theme script in web/index.html that sets
# light or dark before the first paint (web/src/lib/theme.test.ts fails if the hash and the script
# disagree). The JSON-LD in the prerendered pages is a data block of type application/ld+json,
# which never runs, so script-src does not apply to it. No page may frame the app, which rules
# out clickjacking an Approve button.
map $request_method $aiwos_csp {
    default "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; style-src 'self'; script-src 'self' 'sha256-LvPxMPfWdwWKbfsaCpKplNKAnlXlf/I2rxPJ/IIT81g='; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# The names this page may be opened under: localhost, a loopback address, or an IPv4 address when
# shared on the network, each with an optional port. Requests carry the browser's Host through to
# the services (below), so a name that merely resolves here - DNS rebinding - must not pass as
# same-origin to them. Anything else is refused with 421 Misdirected Request.
map $http_host $aiwos_host_ok {
    default 0;
    "~^(localhost|127\.0\.0\.1|\[::1\]|[0-9]{1,3}(\.[0-9]{1,3}){3})(:[0-9]+)?$" 1;
    # A server deployment adds its public host name here, one "name 1;" line, from a file it mounts
    # (infra/aws/docker-compose.prod.yml). The launcher mounts none, and a pattern that matches no
    # file is not an error, so the launcher's allow-list is unchanged.
    include /etc/nginx/aiwos/hosts*.map;
}

# The scheme the browser used. Here, nginx is the edge, so it is its own; a server deployment that
# puts a TLS proxy (Caddy) in front mounts a file mapping that proxy's X-Forwarded-Proto through.
map $http_x_forwarded_proto $aiwos_forwarded_proto {
    default $scheme;
    include /etc/nginx/aiwos/proto*.map;
}

# Which addresses search engines may index, sent as X-Robots-Tag. Keyed on $request_uri, the
# address the visitor asked for: try_files changes $uri to the file it serves, so a map on $uri
# would see /app.html rather than /agents. Indexed: the home page (also at /home, whose canonical
# link names /), the technical page, both with any query (their canonical links drop it), the
# sign-in page without a query, and the files crawlers read as files. Everything else, every
# signed-in route, the not-found page and the API included, is noindex. The signed-in routes are
# deliberately not blocked in robots.txt, or a crawler could never see this header. An empty value
# sends no header at all.
map $request_uri $aiwos_robots {
    default "noindex";
    "/sign-in" "";
    "~^/(home|trust)?(\?.*)?$" "";
    "~^/(robots\.txt|sitemap\.xml|llms(-full)?\.txt)(\?.*)?$" "";
    "~^/(assets|icons)/" "";
    "~^/[^/?]+\.(png|svg|ico|webmanifest|js)(\?.*)?$" "";
}

# How long a browser may keep each file, keyed on the file served ($uri after try_files picks it).
# Vite names every file under /assets/ after a hash of its contents, so it never changes and is
# kept for a year. The pages and the service worker are checked on every visit, so a deploy is
# seen at once. The crawler files for an hour, the icons and the link-preview image for a day.
# Sent without "always", so an error response (a 404 for a missing asset) is never kept.
map $uri $aiwos_cache_control {
    default "";
    "~^/assets/" "public, max-age=31536000, immutable";
    "~\.html$" "no-cache";
    "/sw.js" "no-cache";
    "~^/(robots\.txt|sitemap\.xml|llms(-full)?\.txt)$" "public, max-age=3600";
    "~\.(png|svg|ico|webmanifest)$" "public, max-age=86400";
}

# Server block: the only site in the web container. It checks the Host header, adds the security
# headers, routes API prefixes to their services and serves the built client.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 50m;
    server_tokens off;
    # Redirects name a path, not http://host:80/path: behind Caddy, an absolute redirect would
    # point the browser at the wrong scheme and port.
    absolute_redirect off;

    if ($aiwos_host_ok = 0) {
        return 421;
    }

    # Every response carries these, from the console's pages to the API's errors. No location
    # below adds a header of its own (a location with an add_header inherits none of these), so
    # cache lifetimes and the robots rule come from the maps above instead.
    add_header Content-Security-Policy $aiwos_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag $aiwos_robots always;
    add_header Cache-Control $aiwos_cache_control;

    # Compression settings for the built files. Each location that serves them turns gzip on; the
    # API locations do not, so a proxied response is passed through exactly as the service sent it.
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml text/plain text/xml application/xml application/json application/manifest+json;

    proxy_http_version 1.1;
    # The browser's own host, so a request from this page is same-origin to the service behind
    # it however the page was opened: localhost, 127.0.0.1 or, when shared on the network, this
    # computer's address.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $aiwos_forwarded_proto;
    # Agent runs and voice replies can take a while and may stream.
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Identity service: sign-in, users, roles and the public signing keys (JWKS).
    location ^~ /api/auth          { proxy_pass http://identity:8080; }
    location ^~ /api/users         { proxy_pass http://identity:8080; }
    location ^~ /api/roles         { proxy_pass http://identity:8080; }
    location ^~ /.well-known       { proxy_pass http://identity:8080; }

    # Organisation service: workspaces, stored credentials, organisations and invitations.
    location ^~ /api/workspaces    { proxy_pass http://organisation:8080; }
    location ^~ /api/credentials   { proxy_pass http://organisation:8080; }
    location ^~ /api/orgs          { proxy_pass http://organisation:8080; }
    location ^~ /api/invitations   { proxy_pass http://organisation:8080; }

    # Orchestrator service: agents, goals, runs, approvals, model routing, chat, schedules, skills,
    # workflows, voice and the browser connector.
    location ^~ /api/agents        { proxy_pass http://orchestrator:8080; }
    location ^~ /api/agent-templates { proxy_pass http://orchestrator:8080; }
    location ^~ /api/goals         { proxy_pass http://orchestrator:8080; }
    location ^~ /api/runs          { proxy_pass http://orchestrator:8080; }
    location ^~ /api/approvals     { proxy_pass http://orchestrator:8080; }
    location ^~ /api/providers     { proxy_pass http://orchestrator:8080; }
    location ^~ /api/model-policy  { proxy_pass http://orchestrator:8080; }
    location ^~ /api/conversations { proxy_pass http://orchestrator:8080; }
    location ^~ /api/orchestrator  { proxy_pass http://orchestrator:8080; }
    location ^~ /api/schedules     { proxy_pass http://orchestrator:8080; }
    location ^~ /api/skills        { proxy_pass http://orchestrator:8080; }
    location ^~ /api/workflows     { proxy_pass http://orchestrator:8080; }
    location ^~ /api/voice         { proxy_pass http://orchestrator:8080; }
    location ^~ /api/browser       { proxy_pass http://orchestrator:8080; }
    location ^~ /api/push          { proxy_pass http://orchestrator:8080; }

    # Memory, knowledge, integrations and analytics services, one prefix group each.
    location ^~ /api/memory        { proxy_pass http://memory:8080; }
    location ^~ /api/knowledge     { proxy_pass http://knowledge:8080; }
    location ^~ /api/sources       { proxy_pass http://knowledge:8080; }
    location ^~ /api/integrations  { proxy_pass http://integrations:8080; }
    location ^~ /api/oauth         { proxy_pass http://integrations:8080; }
    location ^~ /api/analytics     { proxy_pass http://analytics:8080; }
    location ^~ /api/audit         { proxy_pass http://analytics:8080; }

    # Any other API path answers 404 here rather than falling through to a page, which would
    # hand the client a 200 page of HTML where it expects JSON.
    location ^~ /api/ { return 404; }

    # Vite names every file under /assets/ after a hash of its contents (cached for a year, above).
    # A missing one is a plain 404, never a page: answering a stale script request with HTML would
    # fail as a MIME error instead of a plain missing file.
    location ^~ /assets/ {
        try_files $uri =404;
        gzip on;
        charset utf-8;
    }

    # The public pages, written as HTML at build time (web/scripts/prerender.mjs) so crawlers that
    # do not run JavaScript read them. Exact matches, served as flat files, so /trust is never
    # redirected to /trust/. /home is the same page as /, which its canonical link names.
    location = / {
        try_files /index.html =404;
        gzip on;
        charset utf-8;
    }
    location = /home {
        try_files /index.html =404;
        gzip on;
        charset utf-8;
    }
    location = /trust {
        try_files /trust.html =404;
        gzip on;
        charset utf-8;
    }
    location = /sign-in {
        try_files /sign-in.html =404;
        gzip on;
        charset utf-8;
    }
    # A trailing slash on a public page goes to the address without it, which is the one indexed.
    location ~ ^/(home|trust|sign-in)/+$ {
        return 301 /$1$is_args$args;
    }

    # Integrations became Connectors on 3 October 2026 (web/src/lib/router.tsx redirectFor).
    location ~ ^/integrations/*$ {
        return 301 /connectors$is_args$args;
    }

    # Every route of the app besides the public pages, by its first segment: the empty shell, which
    # loads the app (noindex, from the map above). Built from the route tables in web/src/App.tsx;
    # web/src/seo/nginxRoutes.test.ts fails if a route is missing here or listed here but gone.
    location ~ ^/(create-workspace|accept-invite|agents|tasks|schedules|skills|workflows|runs|orchestrator|team-room|approvals|chat|knowledge|connectors|routing|members|audit|analytics|settings|setup|profile)(/|$) {
        try_files /app.html =404;
        gzip on;
        charset utf-8;
    }

    # The web app manifest: nginx's own list of types does not name .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        gzip on;
    }

    # The not-found page, only ever as the answer to an unknown address (status 404). It still
    # loads the app, which shows the same page inside the navigation for a signed-in visitor.
    location = /404.html {
        internal;
        gzip on;
        charset utf-8;
    }

    # Everything else is a file from the build (robots.txt, sitemap.xml, llms.txt, the icons, the
    # service worker), or a real 404: an unknown address is no longer answered with a page and a
    # 200, which search engines would record as a soft 404 and a copy of the home page.
    location / {
        try_files $uri =404;
        error_page 404 /404.html;
        gzip on;
        charset utf-8;
    }
}
