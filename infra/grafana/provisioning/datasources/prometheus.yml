# @find: grafana, datasource, prometheus datasource, monitoring, metrics source, observability
# @what: Registers Prometheus as the default Grafana data source.
# @flow: Read by Grafana at startup; Prometheus is configured in infra/prometheus/prometheus.yml
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
