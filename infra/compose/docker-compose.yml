# @find: docker compose, browser runner profile, development stack, local stack, make up, postgres, redis, kafka, qdrant, services, gateway, prometheus, grafana, ports, healthchecks, environment variables
# @what: Docker Compose stack for development: databases, Redis, Kafka, Qdrant, the eight services and monitoring.
# @flow: Started by make up / make down in the Makefile
# The whole platform, locally, with no credentials configured.
#
# Every service starts with sandbox providers and sandbox tool drivers, so `make up` gives a
# working system rather than a system waiting for secrets. Adding a real provider key later is a
# row in the console, not a change to this file.
#
# Every image is pinned to an explicit version, so a rebuild next month runs what ran today.
# PostgreSQL, Redis, Qdrant and Redpanda are the versions the stack was last run with. Prometheus
# (its 3.5 long-term release) and Grafana had never been pulled for this stack, so they are pinned
# to stable releases chosen when the pins were added.

name: aiwos

# Defaults shared by the application services: restart policy, network, the common
# environment (sandbox-friendly local settings and service addresses) and the dependency on
# PostgreSQL and Redis. Each service merges this with <<: *service-defaults and adds its own
# build and published port.
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [aiwos]
  environment: &service-environment
    AIWOS_ENVIRONMENT: local
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: aiwos
    DB_USER: aiwos
    DB_PASSWORD: aiwos
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    KAFKA_BOOTSTRAP: redpanda:9092
    QDRANT_URL: http://qdrant:6333
    AIWOS_JWKS_URI: http://identity:8080/.well-known/jwks.json
    AIWOS_LOG_FORMAT_CONSOLE: ecs
    # No trace collector runs in this stack; set MANAGEMENT_OTLP_TRACING_ENDPOINT to export traces.
    AIWOS_CORS_ORIGINS: http://localhost:5173
    AIWOS_URL_GATEWAY: http://gateway:8080
    AIWOS_URL_IDENTITY: http://identity:8080
    AIWOS_URL_ORGANISATION: http://organisation:8080
    AIWOS_URL_ORCHESTRATOR: http://orchestrator:8080
    AIWOS_URL_MEMORY: http://memory:8080
    AIWOS_URL_KNOWLEDGE: http://knowledge:8080
    AIWOS_URL_INTEGRATIONS: http://integrations:8080
    AIWOS_URL_ANALYTICS: http://analytics:8080
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  # The services are not given a memory limit here on purpose: the JVM reads the cgroup limit,
  # and an over-tight limit in development produces confusing out-of-memory kills rather than
  # useful backpressure.

services:
  # ---- Infrastructure ------------------------------------------------------------------------

  # Role: relational database shared by the services, published on 5432 for local tools.
  postgres:
    image: postgres:17.11-alpine
    networks: [aiwos]
    environment:
      POSTGRES_DB: aiwos
      POSTGRES_USER: aiwos
      POSTGRES_PASSWORD: aiwos
      # C collation makes index scans on text predictable and noticeably faster; the platform
      # does its own case-insensitive comparison where it needs one.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwos -d aiwos"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB

  # Role: cache and rate-limit store, published on 6379.
  redis:
    image: redis:7.4.11-alpine
    networks: [aiwos]
    ports: ["6379:6379"]
    command:
      - redis-server
      - --appendonly
      - "yes"
      # Working memory is expendable under pressure; rate-limit counters and caches are not
      # worth an eviction storm either. allkeys-lru drops the least useful rather than failing.
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Role: vector database for the knowledge service, published on 6333.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    networks: [aiwos]
    ports: ["6333:6333"]
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  redpanda:
    # Speaks the Kafka protocol in a single container with no ZooKeeper, which keeps a
    # development machine's memory for the services rather than the broker.
    image: redpandadata/redpanda:v26.2.3
    networks: [aiwos]
    ports: ["9092:9092", "19092:19092"]
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Role: metrics store; scrapes the services using ../prometheus/prometheus.yml and loads the
  # alert rules from ../prometheus/rules.
  prometheus:
    image: prom/prometheus:v3.5.0
    networks: [aiwos]
    ports: ["9090:9090"]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  # Role: dashboards, provisioned from ../grafana with Prometheus as the data source; anonymous
  # viewing is on for convenience in development only.
  grafana:
    image: grafana/grafana:12.1.0
    networks: [aiwos]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: aiwos
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ---- Platform services ---------------------------------------------------------------------

  # Role: sign-in, users and roles (host port 8081).
  identity:
    <<: *service-defaults
    build: {context: ../.., dockerfile: infra/Dockerfile, args: {SERVICE: identity-service}}
    ports: ["8081:8080"]

  # Role: workspaces, organisations, invitations and stored credentials (host port 8082).
  organisation:
    <<: *service-defaults
    build: {context: ../.., dockerfile: infra/Dockerfile, args: {SERVICE: org-service}}
    ports: ["8082:8080"]

  # Role: agents, runs, approvals, model routing, chat and schedules (host port 8083); also waits
  # for the Kafka-compatible broker.
  orchestrator:
    <<: *service-defaults
    build: {context: ../.., dockerfile: infra/Dockerfile, args: {SERVICE: orchestrator-service}}
    ports: ["8083:8080"]
    # The web browser connector is off unless the "browser" profile runs and these two are set:
    # COMPOSE_PROFILES=browser AIWOS_BROWSER_RUNNER_URL=http://browser:8090 make up
    environment:
      <<: *service-environment
      AIWOS_BROWSER_RUNNER_URL: ${AIWOS_BROWSER_RUNNER_URL:-}
      AIWOS_BROWSER_RUNNER_SECRET: ${AIWOS_BROWSER_RUNNER_SECRET:-local-browser-runner-secret}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  # Role: the memory service (host port 8084).
  memory:
    <<: *service-defaults
    build: {context: ../.., dockerfile: infra/Dockerfile, args: {SERVICE: memory-service}}
    ports: ["8084:8080"]

  # Role: documents and sources, searched through Qdrant (host port 8085).
  knowledge:
    <<: *service-defaults
    build: {context: ../.., dockerfile: infra/Dockerfile, args: {SERVICE: knowledge-service}}
    ports: ["8085:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}

  # Role: connectors and OAuth to outside systems (host port 8086).
  integrations:
    <<: *service-defaults
    build: {context: ../.., dockerfile: infra/Dockerfile, args: {SERVICE: integrations-service}}
    ports: ["8086:8080"]

  # Role: usage analytics and the audit trail (host port 8087).
  analytics:
    <<: *service-defaults
    build: {context: ../.., dockerfile: infra/Dockerfile, args: {SERVICE: analytics-service}}
    ports: ["8087:8080"]

  # Headless Chromium for the built-in web browser connector. Off by default (it is the heaviest
  # container here); start it with the "browser" profile when testing the browser.
  browser:
    profiles: ["browser"]
    build: {context: ../browser-runner}
    restart: unless-stopped
    networks: [aiwos]
    mem_limit: 700m
    shm_size: 256m
    environment:
      BROWSER_RUNNER_SECRET: ${AIWOS_BROWSER_RUNNER_SECRET:-local-browser-runner-secret}
    ports: ["8090:8090"]

  # Role: API gateway with rate limiting through Redis (host port 8080).
  gateway:
    <<: *service-defaults
    build: {context: ../.., dockerfile: infra/Dockerfile, args: {SERVICE: gateway}}
    ports: ["8080:8080"]
    depends_on:
      redis: {condition: service_healthy}
      identity: {condition: service_started}

networks:
  aiwos:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
