# @find: cloudformation, aws stack, ec2, free plan, ap-southeast-2, sydney, m7i-flex.large, elastic ip, pull deployment, systemd timer, ssm session manager, bedrock permissions, budget alarm, optional ecr, sslip.io https, service control policy
# @what: One CloudFormation stack that runs AI Workforce OS on a single free-plan-eligible EC2 instance with HTTPS; the server deploys itself by pulling the public repository (no CI credentials).
# @flow: Created once by hand in the CloudFormation console (docs/2026-10-11_AWS-Deployment_v1.md); the instance then runs infra/aws/aiwos.sh from a systemd timer, and .github/workflows/deploy.yml only reads https://<host>/deploy-status.json
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AI Workforce OS on one EC2 instance (ap-southeast-2): Docker Compose stack with automatic HTTPS
  on an sslip.io name. The server pulls and builds the public repository itself every 2 minutes,
  so nothing outside AWS holds AWS credentials. SSM access (no SSH), optional budget alarm and ECR.

# Written for an account under an AWS Organizations service control policy that denies some IAM
# actions (iam:CreateOpenIDConnectProvider is denied, so there is no GitHub OIDC role). Every
# resource that is not needed to serve the app sits behind a parameter: if a create fails with an
# explicit deny, delete the stack and create it again with that parameter off.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Server}
        Parameters: [InstanceType, AvailabilityZoneIndex, LatestAmiId]
      - Label: {default: Application}
        Parameters: [DemoData, LocalModel, OllamaModel, BedrockModel]
      - Label: {default: Source}
        Parameters: [GitHubRepository, GitHubBranch]
      - Label: {default: Optional resources (turn off any that a service control policy denies)}
        Parameters: [CreateInstanceRole, CreateBudget, BudgetEmail, BudgetCountsCredits, CreateEcrRepositories]
    ParameterLabels:
      InstanceType: {default: EC2 instance type}
      DemoData: {default: Load the demo workspace and its published demo sign-ins}
      LocalModel: {default: Run the local Ollama model as the last fallback}
      CreateInstanceRole: {default: Create the instance role (SSM shell and Bedrock)}
      CreateBudget: {default: Create the monthly budget alarm}
      BudgetEmail: {default: Email for budget alerts}
      CreateEcrRepositories: {default: Also keep a copy of each deployed image in ECR}

Parameters:
  InstanceType:
    Type: String
    Default: m7i-flex.large
    AllowedValues: [m7i-flex.large, c7i-flex.large, t3.small]
    Description: >-
      Free-plan-eligible x86 types. m7i-flex.large (2 vCPU, 8 GiB) runs and builds the whole stack
      with the local model. c7i-flex.large (2 vCPU, 4 GiB) needs LocalModel=false and leans on swap.
      t3.small (2 GiB) cannot run the full stack; it is listed only for a stripped-down test.

  AvailabilityZoneIndex:
    Type: Number
    Default: 0
    AllowedValues: [0, 1, 2]
    Description: Which Availability Zone of the region (0 = the first). Change it if the instance type is not offered in the first one.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023, resolved from AWS's public parameter at create time.

  DemoData:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      true loads the sample workspace and five demo sign-ins that share a password published in the
      source, so anyone who finds the address can sign in and spend your Bedrock credits. Off for a
      private install: the first person to register creates the first workspace.

  LocalModel:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Run Ollama on the server and append it as the last model of every routing chain.

  OllamaModel:
    Type: String
    Default: qwen2.5:1.5b-instruct
    AllowedValues: [qwen2.5:1.5b-instruct, llama3.2:3b, qwen2.5:3b]
    Description: >-
      The local fallback model. qwen2.5:1.5b-instruct (about 1.3 GB in memory) is the one that fits
      beside the whole stack on 8 GiB; the 3B models need about 2.5 GB and leave little headroom.

  BedrockModel:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
    AllowedValues: [apac.amazon.nova-lite-v1:0, apac.amazon.nova-micro-v1:0, apac.amazon.nova-pro-v1:0]
    Description: >-
      First model for workspaces with no routing of their own, through the APAC cross-region
      inference profile. Amazon Nova needs no AWS Marketplace subscription.

  GitHubRepository:
    Type: String
    Default: BitecodesHub/AI_Workforce_OS
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: owner/name of the PUBLIC GitHub repository the server clones and builds (read-only, no token).

  GitHubBranch:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9_./-]+$"
    Description: The branch the server follows; a new commit on it is built and deployed within minutes.

  CreateInstanceRole:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      true creates an IAM role and instance profile for SSM Session Manager and Bedrock calls.
      false only if iam:CreateRole or iam:PassRole is denied: the app then runs on the local model
      only, and there is no shell on the server (status is still at /deploy-status.json).

  CreateBudget:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: false if budgets:* is denied in this account. Also skipped when BudgetEmail is empty.

  BudgetEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Enter a valid email address, or leave it empty for no budget alarm.
    Description: Address AWS Budgets emails when actual spend passes 5 USD and 20 USD in a month.

  BudgetCountsCredits:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      false (recommended on the Free plan) counts usage before credits are applied, so the 5 USD and
      20 USD alerts tell you how fast credits are being used. true counts only what credits do not cover.

  CreateEcrRepositories:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Not needed: the server builds its own images. true creates nine ECR repositories and the
      server pushes each successfully deployed image there as an off-instance copy. Needs
      CreateInstanceRole=true.

Conditions:
  HasRole: !Equals [!Ref CreateInstanceRole, "true"]
  HasBudget: !And
    - !Equals [!Ref CreateBudget, "true"]
    - !Not [!Equals [!Ref BudgetEmail, ""]]
  HasEcr: !And
    - !Equals [!Ref CreateEcrRepositories, "true"]
    - !Condition HasRole
  IsBurstable: !Equals [!Ref InstanceType, t3.small]
  IncludeCredits: !Equals [!Ref BudgetCountsCredits, "true"]

Resources:
  # ---- Network: a small VPC of its own, so the stack does not depend on a default VPC ----------

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: aiwos}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: aiwos}]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [!Ref AvailabilityZoneIndex, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: aiwos-public}]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: aiwos}]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AI Workforce OS - HTTP and HTTPS only; no SSH (use SSM Session Manager)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (redirects to HTTPS; certificate challenge)}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS}
        - {IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTP/3}
      SecurityGroupEgress:
        - {IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: "git fetch, image and model downloads, AWS APIs"}
      Tags: [{Key: Name, Value: aiwos-web}]

  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: aiwos}]

  # ---- Optional off-instance image copies (off by default) -------------------------------------

  IdentityRepository:
    Type: AWS::ECR::Repository
    Condition: HasEcr
    Properties:
      RepositoryName: aiwos/identity-service
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the 2 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}'

  OrgRepository:
    Type: AWS::ECR::Repository
    Condition: HasEcr
    Properties:
      RepositoryName: aiwos/org-service
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the 2 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}'

  OrchestratorRepository:
    Type: AWS::ECR::Repository
    Condition: HasEcr
    Properties:
      RepositoryName: aiwos/orchestrator-service
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the 2 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}'

  MemoryRepository:
    Type: AWS::ECR::Repository
    Condition: HasEcr
    Properties:
      RepositoryName: aiwos/memory-service
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the 2 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}'

  KnowledgeRepository:
    Type: AWS::ECR::Repository
    Condition: HasEcr
    Properties:
      RepositoryName: aiwos/knowledge-service
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the 2 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}'

  IntegrationsRepository:
    Type: AWS::ECR::Repository
    Condition: HasEcr
    Properties:
      RepositoryName: aiwos/integrations-service
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the 2 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}'

  AnalyticsRepository:
    Type: AWS::ECR::Repository
    Condition: HasEcr
    Properties:
      RepositoryName: aiwos/analytics-service
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the 2 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}'

  GatewayRepository:
    Type: AWS::ECR::Repository
    Condition: HasEcr
    Properties:
      RepositoryName: aiwos/gateway
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the 2 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}'

  WebRepository:
    Type: AWS::ECR::Repository
    Condition: HasEcr
    Properties:
      RepositoryName: aiwos/web
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the 2 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}'

  # ---- The server ------------------------------------------------------------------------------

  InstanceRole:
    Type: AWS::IAM::Role
    Condition: HasRole
    Properties:
      Description: AI Workforce OS server - SSM Session Manager and Bedrock calls
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Converse and ConverseStream are authorised as InvokeModel and
              # InvokeModelWithResponseStream. An apac. inference profile routes to foundation
              # models in several APAC regions, hence the region wildcard on foundation models.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:GetFoundationModel
                  - bedrock:ListInferenceProfiles
                  - bedrock:GetInferenceProfile
                Resource: "*"
        - !If
          - HasEcr
          - PolicyName: ecr-push-copies
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ecr:GetAuthorizationToken
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - ecr:BatchCheckLayerAvailability
                    - ecr:BatchGetImage
                    - ecr:CompleteLayerUpload
                    - ecr:GetDownloadUrlForLayer
                    - ecr:InitiateLayerUpload
                    - ecr:PutImage
                    - ecr:UploadLayerPart
                  Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/aiwos/*
          - !Ref AWS::NoValue

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: HasRole
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !If [HasRole, !Ref InstanceProfile, !Ref AWS::NoValue]
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      # IMDSv2 only. Hop limit 2 so the services inside Docker can reach the instance role.
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 30
            Encrypted: true
            DeleteOnTermination: true
      # A burstable type stays within its baseline instead of buying surplus credits.
      CreditSpecification: !If [IsBurstable, {CPUCredits: standard}, !Ref AWS::NoValue]
      Tags: [{Key: Name, Value: aiwos}]
      # A thin bootstrap: swap, Docker with the Compose and Buildx plugins, a clone of the public
      # repository, then infra/aws/aiwos.sh: "init" generates the secrets on the instance (openssl)
      # and writes /opt/aiwos/.env, "install" sets up the systemd timer that runs "aiwos update"
      # every 2 minutes, and the first update builds and starts the stack. Logs:
      # /var/log/aiwos-bootstrap.log, then /var/log/aiwos-deploy.log and journalctl -u aiwos-update.
      # Secrets never appear in this template.
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            exec > >(tee -a /var/log/aiwos-bootstrap.log) 2>&1

            # 4 GB of swap, used only under pressure (image builds beside the running stack).
            if [ ! -f /swapfile ]; then
              dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
              chmod 600 /swapfile
              mkswap /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
            fi
            swapon -a || true
            echo 'vm.swappiness=10' > /etc/sysctl.d/90-aiwos.conf
            sysctl --system >/dev/null

            dnf install -y docker git logrotate jq
            mkdir -p /etc/docker
            echo '{"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"3"}}' > /etc/docker/daemon.json
            systemctl enable --now docker
            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -fsSL --retry 5 -o /usr/local/lib/docker/cli-plugins/docker-compose \
              https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64
            curl -fsSL --retry 5 -o /usr/local/lib/docker/cli-plugins/docker-buildx \
              https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64
            chmod 755 /usr/local/lib/docker/cli-plugins/docker-compose /usr/local/lib/docker/cli-plugins/docker-buildx
            docker compose version

            mkdir -p /opt/aiwos
            chmod 700 /opt/aiwos
            if [ ! -d /opt/aiwos/repo/.git ]; then
              git clone --filter=blob:none --branch ${GitHubBranch} https://github.com/${GitHubRepository}.git /opt/aiwos/repo
            fi

            cat > /opt/aiwos/bootstrap.env <<'EOF'
            PUBLIC_IP=${PublicIp}
            AWS_REGION=${AWS::Region}
            GIT_BRANCH=${GitHubBranch}
            ECR_REGISTRY=${EcrRegistry}
            DEMO_DATA=${DemoData}
            LOCAL_MODEL=${LocalModel}
            OLLAMA_MODEL=${OllamaModel}
            BEDROCK_MODEL=${BedrockModel}
            EOF

            bash /opt/aiwos/repo/infra/aws/aiwos.sh init
            bash /opt/aiwos/repo/infra/aws/aiwos.sh install
            # The first deploy (about 20-25 minutes) runs in the background under systemd, so the
            # stack reaches CREATE_COMPLETE now; follow it at https://<host>/deploy-status.json.
            systemctl start --no-block aiwos-update.service
          - PublicIp: !GetAtt ElasticIp.PublicIp
            EcrRegistry: !If [HasEcr, !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com", ""]

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  # ---- Cost alarm (optional) ---------------------------------------------------------------------

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub aiwos-${AWS::StackName}
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 20, Unit: USD}
        CostTypes:
          IncludeCredit: !If [IncludeCredits, true, false]
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 5, ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 20, ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]

Outputs:
  PublicUrl:
    Description: The live address, with a Let's Encrypt certificate (ready about 20-25 minutes after the stack completes)
    Value: !Sub
      - https://${Dashed}.sslip.io
      - Dashed: !Join ["-", !Split [".", !GetAtt ElasticIp.PublicIp]]
  PublicHost:
    Description: GitHub repository variable AIWOS_PUBLIC_HOST (lets the Deploy workflow report whether a push went live)
    Value: !Sub
      - ${Dashed}.sslip.io
      - Dashed: !Join ["-", !Split [".", !GetAtt ElasticIp.PublicIp]]
  DeployStatusUrl:
    Description: What the server last deployed, and whether it worked (no secrets)
    Value: !Sub
      - https://${Dashed}.sslip.io/deploy-status.json
      - Dashed: !Join ["-", !Split [".", !GetAtt ElasticIp.PublicIp]]
  InstanceId:
    Description: The server
    Value: !Ref Instance
  ElasticIp:
    Description: The server's fixed public address
    Value: !GetAtt ElasticIp.PublicIp
  EcrRegistry:
    Condition: HasEcr
    Description: Where the server keeps copies of deployed images
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aiwos
  SessionManagerUrl:
    Condition: HasRole
    Description: Open a shell on the server in the browser (no SSH)
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${Instance}?region=${AWS::Region}
