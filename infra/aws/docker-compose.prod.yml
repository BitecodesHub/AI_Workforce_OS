# @find: aws production compose, browser runner container, headless chromium, ec2 stack, docker compose prod, caddy https, sslip.io, ollama local model, images built on the server, 8 GB tuning, jvm heap 320m, maven memory cap, log rotation, AIWOS_IMAGE_TAG, deploy-status.json
# @what: The production Docker Compose stack for one EC2 instance: Caddy (HTTPS) in front of the web client, seven services, the browser runner, PostgreSQL, Redis, Qdrant and a local Ollama model.
# @flow: Run on the server only through infra/aws/aiwos.sh, which supplies /opt/aiwos/.env, builds the images on the server tagged with the commit SHA (aiwos/<image>:<sha>) and starts them
#
# Based on infra/launcher/docker-compose.yml and built from the same Dockerfiles, tuned for one
# 8 GB server (m7i-flex.large):
#
#   - Every JVM gets a 320 MB heap with SerialGC (resident about 500-550 MB each, about 3.8 GB for
#     seven), a pool of 5 database connections, and a 768 MB container limit.
#   - Ollama runs qwen2.5:1.5b-instruct on the CPU (about 1.3 GB resident with an 8k context) as
#     the last model of every routing chain. It is the "ollama" profile, on by default through
#     COMPOSE_PROFILES in .env; on a 4 GB instance turn it off (see the deployment guide).
#   - The gateway is not on the browser's path (the web client's nginx routes each API prefix to
#     its service), so it is the optional "gateway" profile.
#   - Only Caddy publishes ports: 80 and 443, with a Let's Encrypt certificate for the server's
#     sslip.io name and the custom domain of infra/aws/site.env once its DNS points here. Nothing else is reachable from outside the Docker network. Caddy also serves
#     /deploy-status.json, which aiwos.sh writes (no secrets).
#   - Images are built on the server, one service at a time, with the Maven and Node heaps capped
#     (AIWOS_MAVEN_OPTS, AIWOS_NODE_OPTIONS) so a build fits beside the running stack and swap.
#
# Secrets are required (":?"), so this file cannot start with a published placeholder. They come
# from /opt/aiwos/.env, generated on the server by aiwos.sh with openssl; they are never in the
# CloudFormation template, the repository or GitHub.

name: aiwos

# Container log rotation: three files of 10 MB per container, so logs cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Defaults shared by the application services: restart policy, log rotation, a 768 MB memory
# limit, the common environment (database, secrets from .env, service addresses and a small JVM
# heap) and the dependency on the data stores. Each service merges this with <<: *service.
x-service: &service
  restart: unless-stopped
  logging: *logging
  networks: [aiwos]
  mem_limit: 768m
  environment: &service_env
    # "production" refuses placeholder secrets and plain-http origins, and sends the refresh cookie
    # as Secure. Demo data cannot be loaded in production, so aiwos.sh sets "local" when the stack
    # was created with demo data on (see the deployment guide).
    AIWOS_ENVIRONMENT: ${AIWOS_ENVIRONMENT:-production}
    AIWOS_LOG_FORMAT: json
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: aiwos
    DB_USER: aiwos
    DB_PASSWORD: ${AIWOS_DB_PASSWORD:?generate /opt/aiwos/.env with infra/aws/aiwos.sh init}
    DB_POOL_SIZE: "5"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    QDRANT_URL: http://qdrant:6333
    AIWOS_ENCRYPTION_KEY_ID: ${AIWOS_ENCRYPTION_KEY_ID:-aws-1}
    AIWOS_ENCRYPTION_MASTER_KEY: ${AIWOS_ENCRYPTION_MASTER_KEY:?generate /opt/aiwos/.env with infra/aws/aiwos.sh init}
    AIWOS_SECURITY_DEVELOPMENT_SECRET: ${AIWOS_SECURITY_DEVELOPMENT_SECRET:?generate /opt/aiwos/.env with infra/aws/aiwos.sh init}
    AIWOS_SECURITY_INTERNAL_SERVICE_SECRET: ${AIWOS_SECURITY_INTERNAL_SERVICE_SECRET:?generate /opt/aiwos/.env with infra/aws/aiwos.sh init}
    AIWOS_DEMO_ENABLED: ${AIWOS_DEMO_ENABLED:-false}
    AIWOS_EVENTS_ENABLED: "false"
    SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    AIWOS_TRACING_ENABLED: "false"
    # Production refuses 1.0; nothing collects traces here anyway.
    AIWOS_TRACE_SAMPLE_RATIO: "0.1"
    AIWOS_JWKS_URI: http://identity:8080/.well-known/jwks.json
    # Every served name, over HTTPS (aiwos.sh writes them: the sslip.io name, plus the custom domain
    # once it is live); the OAuth callback uses the primary one, AIWOS_PUBLIC_BASE_URL.
    AIWOS_CORS_ORIGINS: ${AIWOS_CORS_ORIGINS:-${AIWOS_PUBLIC_BASE_URL:?set AIWOS_PUBLIC_BASE_URL in /opt/aiwos/.env}}
    AIWOS_PUBLIC_BASE_URL: ${AIWOS_PUBLIC_BASE_URL:?set AIWOS_PUBLIC_BASE_URL in /opt/aiwos/.env}
    AIWOS_URL_GATEWAY: http://gateway:8080
    AIWOS_URL_IDENTITY: http://identity:8080
    AIWOS_URL_ORGANISATION: http://organisation:8080
    AIWOS_URL_ORCHESTRATOR: http://orchestrator:8080
    AIWOS_URL_MEMORY: http://memory:8080
    AIWOS_URL_KNOWLEDGE: http://knowledge:8080
    AIWOS_URL_INTEGRATIONS: http://integrations:8080
    AIWOS_URL_ANALYTICS: http://analytics:8080
    # Models. Bedrock is reached with the instance's IAM role (IMDSv2, hop limit 2) where a
    # workspace stores no key; a workspace with no routing of its own gets AIWOS_DEFAULT_ROUTING;
    # and the local model is appended last to every chain at run time.
    AWS_REGION: ${AWS_REGION:-ap-southeast-2}
    AIWOS_BEDROCK_USE_DEFAULT_CREDENTIALS: ${AIWOS_BEDROCK_USE_DEFAULT_CREDENTIALS:-true}
    AIWOS_BEDROCK_REGION: ${AIWOS_BEDROCK_REGION:-ap-southeast-2}
    AIWOS_DEFAULT_ROUTING: ${AIWOS_DEFAULT_ROUTING:-bedrock/apac.amazon.nova-lite-v1:0}
    AIWOS_LOCAL_FALLBACK: ${AIWOS_LOCAL_FALLBACK:-true}
    AIWOS_OLLAMA_BASE_URL: ${AIWOS_OLLAMA_BASE_URL:-http://ollama:11434/v1}
    AIWOS_OLLAMA_MODEL: ${AIWOS_OLLAMA_MODEL:-qwen2.5:1.5b-instruct}
    # Seven JVMs share 8 GB with PostgreSQL, Qdrant and the local model.
    JAVA_TOOL_OPTIONS: >-
      -Xms64m -Xmx320m -XX:+UseSerialGC -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m
      -Xss512k -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 40
    # Seven JVMs boot at once on two vCPUs on the first start.
    start_period: 420s
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    qdrant: {condition: service_started}

# Build settings shared by the backend images: the repository root as the context and the
# launcher Dockerfile, so the images are built on this server from the checked-out commit.
x-build: &build
  context: ../..
  dockerfile: infra/launcher/services.Dockerfile

# Passed to the Maven build stage of services.Dockerfile (declared there as an ARG).
x-maven-opts: &maven_opts ${AIWOS_MAVEN_OPTS:--Xmx1g -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=384m}

# Services. Caddy is the only one that publishes ports.
services:
  # Role: the HTTPS edge. Obtains the certificates, serves /deploy-status.json and proxies the rest
  # to the web container (see infra/aws/Caddyfile).
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    logging: *logging
    networks: [aiwos]
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AIWOS_PUBLIC_HOST: ${AIWOS_PUBLIC_HOST:?set AIWOS_PUBLIC_HOST in /opt/aiwos/.env}
      # The other served name (the sslip.io one once the custom domain of infra/aws/site.env is
      # primary); Caddy gets a certificate for each and redirects it to AIWOS_PUBLIC_HOST.
      AIWOS_ALT_HOSTS: ${AIWOS_ALT_HOSTS:-}
    # Directories, not single files: aiwos.sh replaces the Caddyfile and the status file by rename,
    # which a single-file bind mount would never see.
    volumes:
      - ${AIWOS_CONFIG_DIR:-./config}/caddy:/etc/caddy:ro
      - ${AIWOS_STATUS_DIR:-./status}:/srv/status:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: {condition: service_started}

  # Role: relational database shared by the services; its data lives in a named volume.
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *logging
    networks: [aiwos]
    mem_limit: 768m
    environment:
      POSTGRES_DB: aiwos
      POSTGRES_USER: aiwos
      # Read only when the data volume is first created.
      POSTGRES_PASSWORD: ${AIWOS_DB_PASSWORD:?generate /opt/aiwos/.env with infra/aws/aiwos.sh init}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command: ["postgres", "-c", "max_connections=120", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwos -d aiwos"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Role: cache and rate-limit store, persisted in a named volume.
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    logging: *logging
    networks: [aiwos]
    mem_limit: 192m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Role: vector database for the knowledge service, persisted in a named volume.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    logging: *logging
    networks: [aiwos]
    mem_limit: 768m
    volumes: [qdrant-data:/qdrant/storage]

  # The local model server, OpenAI-compatible at http://ollama:11434/v1. On its first start it pulls
  # AIWOS_OLLAMA_MODEL (about 1 GB for the default) into its volume; it is healthy once the model is
  # there. Runs are never held up waiting for it: it is only the last candidate of each chain.
  ollama:
    image: ollama/ollama:0.9.6
    profiles: ["ollama"]
    restart: unless-stopped
    logging: *logging
    networks: [aiwos]
    mem_limit: 2560m
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 30m
      AIWOS_OLLAMA_MODEL: ${AIWOS_OLLAMA_MODEL:-qwen2.5:1.5b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama serve & pid=$$!;
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull "$$AIWOS_OLLAMA_MODEL" || echo "Could not pull $$AIWOS_OLLAMA_MODEL; will retry on the next start";
        wait $$pid
    volumes: [ollama-data:/root/.ollama]
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$AIWOS_OLLAMA_MODEL\" >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 900s

  # Role: sign-in, users and roles.
  identity:
    <<: *service
    image: ${AIWOS_IMAGE_PREFIX:-aiwos}/identity-service:${AIWOS_IMAGE_TAG:-latest}
    build: {<<: *build, args: {SERVICE: identity-service, MAVEN_OPTS: *maven_opts}}

  # Role: workspaces, organisations, invitations and stored credentials.
  organisation:
    <<: *service
    image: ${AIWOS_IMAGE_PREFIX:-aiwos}/org-service:${AIWOS_IMAGE_TAG:-latest}
    build: {<<: *build, args: {SERVICE: org-service, MAVEN_OPTS: *maven_opts}}

  # Role: agents, runs, approvals, model routing, chat and schedules.
  orchestrator:
    <<: *service
    image: ${AIWOS_IMAGE_PREFIX:-aiwos}/orchestrator-service:${AIWOS_IMAGE_TAG:-latest}
    build: {<<: *build, args: {SERVICE: orchestrator-service, MAVEN_OPTS: *maven_opts}}
    # Only the orchestrator talks to the browser runner, so only it gets the runner's secret.
    environment:
      <<: *service_env
      AIWOS_BROWSER_RUNNER_URL: http://browser:8090
      AIWOS_BROWSER_RUNNER_SECRET: ${AIWOS_BROWSER_RUNNER_SECRET:-}

  # The built-in web browser: headless Chromium behind a small HTTP API, one page per run, at most
  # two at once. Debian-based (Chromium does not run on Alpine), not published outside the Docker
  # network, and every request a page makes goes through its own filtering proxy, which refuses
  # private, loopback and metadata addresses. Chromium starts with the container and stays running,
  # so no step waits for it: about 150 MB at rest and 300-600 MB while in use. Set
  # BROWSER_RUNNER_BROWSER_IDLE_MS (milliseconds) to close it when idle on a tighter server.
  # AIWOS_BROWSER_RUNNER_SECRET is generated into /opt/aiwos/.env by aiwos.sh; without it the
  # runner refuses every request and the browser connector says it is not running.
  browser:
    image: ${AIWOS_IMAGE_PREFIX:-aiwos}/browser-runner:${AIWOS_IMAGE_TAG:-latest}
    build:
      context: ../browser-runner
    restart: unless-stopped
    logging: *logging
    networks: [aiwos]
    mem_limit: 700m
    shm_size: 256m
    environment:
      BROWSER_RUNNER_SECRET: ${AIWOS_BROWSER_RUNNER_SECRET:-}
      BROWSER_RUNNER_MAX_SESSIONS: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8090/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Role: the memory service (what agents remember between runs).
  memory:
    <<: *service
    image: ${AIWOS_IMAGE_PREFIX:-aiwos}/memory-service:${AIWOS_IMAGE_TAG:-latest}
    build: {<<: *build, args: {SERVICE: memory-service, MAVEN_OPTS: *maven_opts}}

  # Role: documents and sources, searched through Qdrant.
  knowledge:
    <<: *service
    image: ${AIWOS_IMAGE_PREFIX:-aiwos}/knowledge-service:${AIWOS_IMAGE_TAG:-latest}
    build: {<<: *build, args: {SERVICE: knowledge-service, MAVEN_OPTS: *maven_opts}}

  # Role: connectors and OAuth to outside systems.
  integrations:
    <<: *service
    image: ${AIWOS_IMAGE_PREFIX:-aiwos}/integrations-service:${AIWOS_IMAGE_TAG:-latest}
    build: {<<: *build, args: {SERVICE: integrations-service, MAVEN_OPTS: *maven_opts}}

  # Role: usage analytics and the audit trail.
  analytics:
    <<: *service
    image: ${AIWOS_IMAGE_PREFIX:-aiwos}/analytics-service:${AIWOS_IMAGE_TAG:-latest}
    build: {<<: *build, args: {SERVICE: analytics-service, MAVEN_OPTS: *maven_opts}}

  # Role: optional API gateway (the "gateway" profile); the browser does not use it.
  gateway:
    <<: *service
    profiles: ["gateway"]
    image: ${AIWOS_IMAGE_PREFIX:-aiwos}/gateway:${AIWOS_IMAGE_TAG:-latest}
    build: {<<: *build, args: {SERVICE: gateway, MAVEN_OPTS: *maven_opts}}

  # Role: nginx serving the web client and proxying each API prefix to its service, behind Caddy.
  web:
    image: ${AIWOS_IMAGE_PREFIX:-aiwos}/web:${AIWOS_IMAGE_TAG:-latest}
    build:
      context: ../../web
      dockerfile: ../infra/launcher/web.Dockerfile
      additional_contexts: {launcher: ../launcher}
      args:
        NODE_OPTIONS: ${AIWOS_NODE_OPTIONS:---max-old-space-size=1536}
        # The address the prerendered pages, robots.txt, sitemap.xml and llms.txt name as canonical.
        # Its own setting, not AIWOS_PUBLIC_HOST, so an image built before a host change cannot
        # point search engines at the old name.
        SITE_URL: ${AIWOS_SITE_URL:-https://ai-workforce.bitecodes.com}
        SITE_LASTMOD: ${AIWOS_SITE_LASTMOD:-}
    restart: unless-stopped
    logging: *logging
    networks: [aiwos]
    mem_limit: 128m
    # The public host names for nginx's allow-list, and Caddy's X-Forwarded-Proto passed through;
    # aiwos.sh writes both files (see the includes in infra/launcher/nginx.conf).
    volumes:
      - ${AIWOS_CONFIG_DIR:-./config}/nginx:/etc/nginx/aiwos:ro
    depends_on:
      identity: {condition: service_healthy}
      organisation: {condition: service_healthy}
      orchestrator: {condition: service_healthy}
      memory: {condition: service_healthy}
      knowledge: {condition: service_healthy}
      integrations: {condition: service_healthy}
      analytics: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

# Networks and volumes: one private bridge network for all containers, and named volumes
# for the data that must survive a redeploy.
networks:
  aiwos:

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  ollama-data:
  caddy-data:
  caddy-config:
