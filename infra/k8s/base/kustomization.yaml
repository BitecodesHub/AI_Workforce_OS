# @find: kubernetes, k8s, kustomize, base manifests, resource list, common labels, deploy
# @what: Kustomize base that lists every Kubernetes manifest making up the platform.
# @flow: Extended by infra/k8s/overlays/staging/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aiwos

resources:
  - namespace.yaml
  - config.yaml
  - network-policy.yaml
  - gateway.yaml
  - identity.yaml
  - organisation.yaml
  - orchestrator.yaml
  - memory.yaml
  - knowledge.yaml
  - integrations.yaml
  - analytics.yaml
  - ingress.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: aiwos
      app.kubernetes.io/managed-by: kustomize
