# @find: kubernetes, k8s, ingress, routes, hostname, tls, external access, web client route, api route
# @what: Kubernetes ingress that exposes the gateway and web client outside the cluster.
# @flow: Listed in infra/k8s/base/kustomization.yaml
# The only route into the platform.
#
# Everything arrives at the gateway; no other service is exposed. The headers below are set at
# the edge so they apply to every response, including ones a service failed to produce.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiwos
  namespace: aiwos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
    # Ingestion uploads whole documents, and the default 60 seconds cuts a large one off.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.aiworkforce.os]
      secretName: aiwos-tls
  rules:
    - host: app.aiworkforce.os
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {name: http}
