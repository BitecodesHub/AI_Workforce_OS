<!doctype html>
<!--
  @find: html entry page, index.html, page title, meta description, favicon, theme color, link preview, open graph, social share, root div, app mount, prerender template, AI Workforce OS
  @what: The HTML page the browser loads; it mounts the React app and holds the title, description and icons. The build also uses it as the template for every prerendered page.
  @flow: Loads src/main.tsx, which renders App; scripts/prerender.mjs turns the built copy into dist/index.html, trust.html, sign-in.html, 404.html and app.html
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Applies the theme before the first paint, so a dark-theme visitor never sees a white flash.
      Mirrors src/lib/theme.ts (key 'aiwos.theme'; System unless Light or Dark is stored), and
      theme.test.ts runs this exact script. It also sets data-session when this browser has signed
      in before (the 'aiwos.signedIn' hint in src/lib/session.ts), so the prerendered home page is
      not shown to someone about to see the Command Map (see components.css). Its sha256 is allowed
      by the Content-Security-Policy in infra/launcher/nginx.conf: change one character here and
      update that hash too (the test says so if they disagree).
    -->
    <script>(function(){var s,g;try{s=localStorage.getItem('aiwos.theme');g=localStorage.getItem('aiwos.signedIn')}catch(e){}var d=s==='dark'||(s!=='light'&&!!window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);var t=d?'dark':'light';var r=document.documentElement;r.setAttribute('data-theme',t);r.style.colorScheme=t;if(g==='1')r.setAttribute('data-session','')})()</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>AI Workforce OS</title>
    <meta name="description" content="AI assistants that do routine work and ask before anything is sent." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The browser's toolbar colour follows the page background, light or dark (tokens.css --paper). -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050506" media="(prefers-color-scheme: dark)" />
    <!--
      Search and link previews. scripts/prerender.mjs writes each page's own title and description
      over the two above, and adds its canonical link, robots rule, Open Graph and Twitter card
      (with the absolute address of public/og-image.png, 1200x630) and its JSON-LD structured data,
      from src/lib/seo.ts and src/seo. In the browser, App.tsx keeps them in step as the app moves
      between screens.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
