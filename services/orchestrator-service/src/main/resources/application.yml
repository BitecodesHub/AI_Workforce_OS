# @find: orchestrator application config, application.yml, spring settings, port, database url, flyway, model routing settings, chat queue, schedules, voice elevenlabs settings, browser runner url, browser runner secret, knowledge service url, runtime tuning
# @what: Service-specific Spring configuration for the orchestrator (agents, goals, runs, approvals, chat, schedules, voice).
# @flow: Imports platform-defaults.yml for shared settings; bound by OrchestratorApplication and the *Properties classes
# Agents, goals, runs, approvals and model routing.
#
# This file holds only what belongs to this service. Everything shared - security, resilience,
# observability, event and HTTP defaults - comes from platform-defaults.yml, so a change to how
# the platform behaves is made once rather than in eight places.

spring:
  application:
    name: orchestrator-service
  config:
    import: "classpath:platform-defaults.yml"

  task:
    scheduling:
      # Applies only when virtual threads are off. The platform turns them on, and Spring then uses
      # a scheduler that ignores this setting (see MaintenanceScheduler.advanceGoals). Without them,
      # a single pool thread would make the abandoned-run reaper and the approval-expiry sweep
      # wait behind every agent run the goal sweep starts, and those can take minutes.
      pool:
        size: 3

  datasource:
    # Each service owns one schema and never reads another service's tables. The database is
    # shared in development for convenience; in production each service gets its own instance,
    # and only this URL changes.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aiwos}?currentSchema=orchestrator
    username: ${DB_USER:aiwos}
    password: ${DB_PASSWORD:aiwos}
    hikari:
      pool-name: orchestrator-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
      # Shorter than the database's own idle timeout, so the pool retires a connection before
      # the server does and no request ever picks up a socket the server has already closed.
      max-lifetime: 1500000
      idle-timeout: 300000
      leak-detection-threshold: 30000

  # JPA: validation only, schema "orchestrator", batched writes in UTC. Open-in-view is off so no database work happens while a response is rendered.
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Letting Hibernate alter tables would mean the schema in
      # production depends on which code happened to start first.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orchestrator
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true

  # Flyway migrations for this service only, from classpath:db/migration, applied into the orchestrator schema.
  flyway:
    enabled: true
    schemas: orchestrator
    default-schema: orchestrator
    create-schemas: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # A checksum mismatch means a released migration was edited. Failing is correct: the
    # environments that already ran the old version would otherwise diverge silently.
    validate-on-migrate: true

  # Redis connection (shared cache and locks), pooled with a short command timeout.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8

  # Kafka: reliable producer settings, and a consumer group that commits offsets manually after each event is handled.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      # Retries plus idempotence: a broker failover must not silently drop an event, and must
      # not duplicate one either.
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: zstd
    consumer:
      group-id: orchestrator-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
    listener:
      ack-mode: manual_immediate
      concurrency: 3
      observation-enabled: true

# HTTP port of this service; the default can be overridden with SERVER_PORT.
server:
  port: ${SERVER_PORT:8083}

# Application settings read by the *Properties classes of this service.
aiwos:
  service-name: orchestrator
  runs:
    # How long a run stays claimed by the instance driving it without a renewal. A heartbeat
    # renews it every quarter of this; once it lapses, the reaper marks the run abandoned.
    lease: PT2M
  questions:
    # How long a question a run asks stays open before the run finishes with what it has. A
    # person can extend it by this much at a time, up to seven days from when it was asked.
    window: PT24H
  scheduling:
    # Closes questions nobody answered in time, and questions whose work has stopped.
    question-expiry-interval: PT120S
    # Resumes runs answered or approved while nothing was left to resume them, such as a restart.
    resume-interval: PT60S
  # ElevenLabs voice settings bound to VoiceProperties. The API key itself is never here: it is stored per workspace and looked up through credential-ref.
  voice:
    elevenlabs:
      base-url: ${AIWOS_VOICE_ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
      tts-model: ${AIWOS_VOICE_ELEVENLABS_TTS_MODEL:eleven_flash_v2_5}
      stt-model: ${AIWOS_VOICE_ELEVENLABS_STT_MODEL:scribe_v2}
      output-format: ${AIWOS_VOICE_ELEVENLABS_OUTPUT_FORMAT:mp3_44100_128}
      max-characters: ${AIWOS_VOICE_ELEVENLABS_MAX_CHARACTERS:2500}
      timeout: ${AIWOS_VOICE_ELEVENLABS_TIMEOUT:PT30S}
      credential-ref: elevenlabs
  # The built-in web browser: the browser runner sidecar (infra/browser-runner) and the secret it
  # expects in X-Runner-Secret. Both empty (the default) turns the browser connector off: every
  # call says the browser is not running. Locally: run the runner and set both variables.
  browser:
    runner-url: ${AIWOS_BROWSER_RUNNER_URL:}
    runner-secret: ${AIWOS_BROWSER_RUNNER_SECRET:}
  # Push notifications on people's own devices (Web Push, read by push.PushService and
  # push.VapidKeyStore). The VAPID key pair is generated once and stored encrypted unless both
  # AIWOS_VAPID_PUBLIC_KEY and AIWOS_VAPID_PRIVATE_KEY (raw P-256, base64url) are set. The subject
  # defaults to mailto:no-reply@<the host the app is served from>; allowed-hosts adds push
  # services beyond the browsers' own (comma-separated host names or parent domains).
  push:
    enabled: ${AIWOS_PUSH_ENABLED:true}
    subject: ${AIWOS_PUSH_SUBJECT:}
    allowed-hosts: ${AIWOS_PUSH_ALLOWED_HOSTS:}

# OpenAPI document and Swagger UI endpoints.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

---
# Tests run against Testcontainers, so nothing here points at a developer's own database.
spring:
  config:
    activate:
      on-profile: test
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
aiwos:
  environment: test
  events:
    enabled: false
