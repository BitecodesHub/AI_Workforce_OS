# @find: deploy, aws deployment, continuous deployment, pull deployment, deploy status, deploy-status.json, did the push go live, AIWOS_PUBLIC_HOST
# @what: On every push to main: runs CI, then watches the live server's https://<host>/deploy-status.json until that commit is deployed (or the server reports a failure), so GitHub shows whether the push went live.
# @flow: Calls ci.yml; reads the status file that infra/aws/aiwos.sh writes on the EC2 server created by infra/aws/cloudformation.yaml
#
# This workflow has NO AWS access and needs no secrets. The server deploys itself: a systemd timer
# on it fetches main every 2 minutes, builds the new commit, starts it, checks health and rolls
# back on failure (see docs/2026-10-11_AWS-Deployment_v1.md). The server does not wait for CI, so
# a red CI run here does not stop a deploy; this job only reports what happened.
#
# Repository variable (Settings > Secrets and variables > Actions > Variables):
#   AIWOS_PUBLIC_HOST  the stack's PublicHost output, for example 3-104-12-5.sslip.io
# Until it is set, the watch step is skipped with a notice and only CI runs.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    uses: ./.github/workflows/ci.yml

  live:
    name: Wait until live on the server
    needs: ci
    # Still reports the deploy when CI fails: the server deploys main regardless.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip when no server is configured
        if: vars.AIWOS_PUBLIC_HOST == ''
        run: echo "::notice::Repository variable AIWOS_PUBLIC_HOST is not set; not checking the live server."

      # Full history, to tell whether a newer deployed commit already contains this one.
      - uses: actions/checkout@v4
        if: vars.AIWOS_PUBLIC_HOST != ''
        with:
          fetch-depth: 0

      - name: Poll https://<host>/deploy-status.json
        if: vars.AIWOS_PUBLIC_HOST != ''
        env:
          HOST: ${{ vars.AIWOS_PUBLIC_HOST }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          url="https://$HOST/deploy-status.json"
          deadline=$((SECONDS + 25 * 60))
          contains() {  # contains A B: commit A is B or an ancestor of B
            [ "$1" = "$2" ] && return 0
            git cat-file -e "$2^{commit}" 2>/dev/null || git fetch --quiet origin "$BRANCH" || true
            git merge-base --is-ancestor "$1" "$2" 2>/dev/null
          }
          failed_result() {
            case "$1" in build_failed | rolled_back | rollback_failed | failed) return 0 ;; *) return 1 ;; esac
          }
          echo "Waiting for ${SHA:0:12} at $url (up to 25 minutes)"
          last=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            if status="$(curl -fsS --max-time 15 "$url" 2>/dev/null)" && echo "$status" | jq -e . >/dev/null 2>&1; then
              current="$(echo "$status" | jq -r '.current_sha // ""')"
              phase="$(echo "$status" | jq -r '.phase // ""')"
              attempt="$(echo "$status" | jq -r '.last_attempt.sha // ""')"
              result="$(echo "$status" | jq -r '.last_attempt.result // ""')"
              message="$(echo "$status" | jq -r '.last_attempt.message // ""')"
              line="live=${current:0:12} phase=$phase attempt=${attempt:0:12} result=$result"
              [ "$line" != "$last" ] && echo "$line" && last="$line"

              if [ -n "$current" ] && contains "$SHA" "$current"; then
                echo "### Live: ${SHA:0:12} is deployed on https://$HOST (server is at ${current:0:12})" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if [ -n "$attempt" ] && failed_result "$result" && contains "$SHA" "$attempt"; then
                echo "::error::The server did not deploy ${attempt:0:12}: $result - $message"
                echo "### Not live: $result - $message" >> "$GITHUB_STEP_SUMMARY"
                echo "Status: $url. Logs: sudo journalctl -u aiwos-update (Session Manager)." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            else
              [ "$last" != unreachable ] && echo "Status file not reachable yet" && last=unreachable
            fi
            sleep 30
          done
          echo "::error::${SHA:0:12} was not live after 25 minutes. Check $url and: sudo aiwos status"
          exit 1
