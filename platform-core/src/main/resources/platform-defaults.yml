# @find: platform defaults, default settings, imported by every service, logging, tracing sampling, jwt, jwks, database defaults, actuator, management, aiwos settings
# @what: Default settings every service imports: security, logging, tracing, health and platform behaviour.
# @flow: Imported by each service's application.yml
# Defaults shared by every service.
#
# A service imports this file and overrides only what is genuinely its own: its name, its port,
# its database schema and its own dependencies. Anything that should be the same everywhere is
# set here once, so eight services cannot drift apart in how they log, time out or retry.
#
# Every value can be overridden by an environment variable using Spring's relaxed binding, for
# example AIWOS_SECURITY_ACCESS_TOKEN_TTL=PT5M. Nothing here is a secret; secrets arrive only
# as environment variables or from the secret store.

aiwos:
  environment: ${AIWOS_ENVIRONMENT:local}
  service-version: ${AIWOS_SERVICE_VERSION:0.1.0-SNAPSHOT}

  security:
    issuer: ${AIWOS_ISSUER:aiwos}
    audience: ${AIWOS_AUDIENCE:aiwos-api}
    jwks-uri: ${AIWOS_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    # Five minutes is the interim answer to revocation. No service compares a token's permission
    # version with the role's current one yet, so a removed member, a narrowed role or a sign-out
    # everywhere is felt only when the token is next refreshed. The lifetime is what bounds that
    # delay, so it is kept short until a real revocation check exists.
    access-token-ttl: PT5M
    refresh-token-ttl: P30D
    # An internal token lives only long enough to cross the cluster once. A leaked one is
    # useless a minute later, which is the point.
    internal-token-ttl: PT60S
    clock-skew-leeway: PT30S
    argon2:
      iterations: 3
      memory-kib: 65536
      parallelism: 4
    encryption:
      master-key-id: ${AIWOS_ENCRYPTION_KEY_ID:local-dev}
      master-key-base64: ${AIWOS_ENCRYPTION_MASTER_KEY:}
    # No outbound email exists on this platform yet - no SMTP is configured and no verification
    # message is ever sent - so requiring verification here would make every new account a dead
    # end with no way to complete it. False is a local/demo default; a deployment that adds real
    # email delivery sets AIWOS_REQUIRE_EMAIL_VERIFICATION=true and wires the sender.
    require-email-verification: ${AIWOS_REQUIRE_EMAIL_VERIFICATION:false}

  http:
    connect-timeout: PT5S
    read-timeout: PT60S
    cors-allowed-origins: ${AIWOS_CORS_ORIGINS:http://localhost:5173}

  rate-limit:
    enabled: true
    default-requests-per-minute: 600
    auth-attempts-per-minute: 10

  events:
    enabled: ${AIWOS_EVENTS_ENABLED:true}
    topic-prefix: aiwos
    max-delivery-attempts: 4
    retry-backoff: PT5S,PT30S,PT5M

  resilience:
    failure-rate-percent-threshold: 50
    wait-duration-in-open-state: PT30S
    max-retry-attempts: 3
    retry-jitter: true
    default-call-timeout: PT60S

  observability:
    # The same ratio Spring's tracer samples with, read back here so the startup validator checks
    # the value that is actually in force. It used to read an unbound field that always held 1.0,
    # which production refuses, so no deployment that set AIWOS_TRACE_SAMPLE_RATIO could start.
    trace-sample-ratio: ${management.tracing.sampling.probability}

  runtime-config:
    enabled: true
    cache-ttl: PT60S

  services:
    gateway: ${AIWOS_URL_GATEWAY:http://localhost:8080}
    identity: ${AIWOS_URL_IDENTITY:http://localhost:8081}
    organisation: ${AIWOS_URL_ORGANISATION:http://localhost:8082}
    orchestrator: ${AIWOS_URL_ORCHESTRATOR:http://localhost:8083}
    memory: ${AIWOS_URL_MEMORY:http://localhost:8084}
    knowledge: ${AIWOS_URL_KNOWLEDGE:http://localhost:8085}
    integrations: ${AIWOS_URL_INTEGRATIONS:http://localhost:8086}
    analytics: ${AIWOS_URL_ANALYTICS:http://localhost:8087}

spring:
  # The default 256KB buffer on an outbound WebClient response is sized for typical JSON replies,
  # not for a batch of embedding vectors: 96 passages at 1536 dimensions each serialises well past
  # it, and the call fails with a buffer-limit error that looks nothing like what actually broke.
  # Every service that calls a sibling over WebClient - embeddings, credentials, audit events -
  # shares this default rather than each discovering the limit on its own oversized response.
  codec:
    max-in-memory-size: 10MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
      # A date without a zone is ambiguous, and ambiguity in a timestamp becomes a wrong
      # invoice or a missed approval deadline. Everything is an Instant, in UTC.
      adjust-dates-to-context-time-zone: false
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      # Most work here waits on a database, a model provider or another service. Virtual threads
      # let that waiting cost a stack rather than a platform thread.
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s

  servlet:
    multipart:
      # Matches the cap the ingress enforces and the one the upload endpoint states. Three
      # places declaring a limit is fine; three places declaring different limits means the
      # smallest wins silently, and a person sees "too large" for a file the interface said
      # was acceptable.
      max-file-size: 25MB
      max-request-size: 26MB
      file-size-threshold: 1MB

server:
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
  tomcat:
    max-swallow-size: 10MB
    connection-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        # Only what a platform needs. Anything that dumps configuration or heap stays closed.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        # Readiness decides whether traffic arrives, so it holds only what a service cannot work
        # without: its own state and its database. Redis is a cache here - runtime configuration
        # reads through to the database and working memory degrades when it is gone - so a Redis
        # restart must not take every service out of rotation at once. The gateway has no
        # database and turns off group validation, so it ends up with readinessState alone.
        readiness:
          include: readinessState,db
        # Everything a service talks to, for dashboards and alerts rather than for routing.
        # Details are shown only to an authorised caller, like the main health endpoint.
        dependencies:
          include: db,redis
          show-details: when-authorized
  metrics:
    tags:
      service: ${aiwos.service-name:unknown}
  tracing:
    # Spans are always created and carried (the trace id is in every log line and every error body);
    # AIWOS_TRACING_ENABLED=false turns even that off, as the one-click launcher does.
    enabled: ${AIWOS_TRACING_ENABLED:true}
    sampling:
      probability: ${AIWOS_TRACE_SAMPLE_RATIO:1.0}
  # Nothing is exported unless an endpoint is set, and none is set here on purpose: Spring Boot
  # builds an exporter for any value of management.otlp.tracing.endpoint, an empty one included,
  # so a blank default would aim every service at nothing. Kubernetes and compose set
  # MANAGEMENT_OTLP_TRACING_ENDPOINT (the collector's full /v1/traces address); a laptop does not.

logging:
  structured:
    format:
      # ecs, gelf or logstash print one JSON object per line, MDC included, which is what a log
      # pipeline wants. Empty keeps the plain text below, so a laptop and scripts/dev-backend.sh
      # stay readable. Kubernetes and compose set AIWOS_LOG_FORMAT_CONSOLE=ecs.
      console: ${AIWOS_LOG_FORMAT_CONSOLE:}
  pattern:
    # Plain-text mode prints the same references the JSON fields carry, so the "Reference" a person
    # reads out from an error screen is findable either way, and a run's lines can be pulled out
    # of a busy log by run or workspace. Empty where the work has no such id.
    correlation: "[req=%X{requestId:-} run=%X{runId:-} org=%X{orgId:-}] "
  level:
    root: INFO
    os.aiworkforce: ${AIWOS_LOG_LEVEL:INFO}
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.web: INFO
